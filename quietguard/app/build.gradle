plugins { id 'com.android.application' }
android {
    namespace 'cn.quietguard.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (System.getenv('QUIETGUARD_KEYSTORE')) {
                storeFile file(System.getenv('QUIETGUARD_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig { applicationId 'cn.quietguard.app'; minSdk 26; targetSdk 35; versionCode 19; versionName '0.4.13' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
