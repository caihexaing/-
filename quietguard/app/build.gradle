plugins { id 'com.android.application' }
android {
    namespace 'cn.quietguard.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (System.getenv('QUIETGUARD_KEYSTORE')) {
                storeFile file(System.getenv('QUIETGUARD_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig {
        applicationId 'cn.quietguard.app'; minSdk 26; targetSdk 35; versionCode 36; versionName '0.5.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation files('libs/hev-socks5-tunnel-2.19.3.aar')
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
