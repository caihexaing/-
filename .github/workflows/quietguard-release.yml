name: 发布净屏 APK

on:
  push:
    tags:
      - 'quietguard-v*'

permissions:
  contents: write

concurrency:
  group: quietguard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 验证版本和签名配置
        env:
          SIGNING_KEY: ${{ secrets.QUIETGUARD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, base64
          text = pathlib.Path('quietguard/app/build.gradle').read_text()
          version = re.search(r"versionName '([0-9]+\.[0-9]+\.[0-9]+)'", text).group(1)
          assert os.environ['GITHUB_REF_NAME'] == 'quietguard-v' + version, 'Tag and versionName differ'
          assert os.environ.get('SIGNING_KEY'), 'Missing signing key secret'
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'quietguard.keystore'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VERSION=' + version + '\nQUIETGUARD_KEYSTORE=' + str(key) + '\n')
          PY
      - name: 安装 Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: 核心规则与版本测试
        working-directory: quietguard
        run: |
          mkdir -p build/core-checks
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/cn/quietguard/app/RuleSet.java app/src/main/java/cn/quietguard/app/DnsPacket.java app/src/main/java/cn/quietguard/app/UpdateVersion.java app/src/main/java/cn/quietguard/app/SplashPolicy.java app/src/main/java/cn/quietguard/app/SplashWindow.java app/src/main/java/cn/quietguard/app/SplashScanBudget.java app/src/main/java/cn/quietguard/app/ProtectionMode.java app/src/main/java/cn/quietguard/app/UpdateIntegrity.java app/src/main/java/cn/quietguard/app/UpdateVpnState.java app/src/main/java/cn/quietguard/app/SplashButton.java app/src/main/java/cn/quietguard/app/SplashDiagnostic.java app/src/main/java/cn/quietguard/app/SplashTextTap.java tests/TextTapChecks.java tests/ButtonChecks.java tests/CoreChecks.java app/src/main/java/cn/quietguard/app/AccessibilitySelection.java tests/AccessibilityChecks.java tests/VersionChecks.java tests/SplashChecks.java tests/RuntimeChecks.java tests/UpdateChecks.java tests/UpdateVpnChecks.java app/src/main/java/cn/quietguard/app/ProtectionControl.java app/src/main/java/cn/quietguard/app/ProtectionStatus.java app/src/main/java/cn/quietguard/app/SelectionPlan.java tests/ControlChecks.java
          java -cp build/core-checks cn.quietguard.app.CoreChecks
          java -cp build/core-checks cn.quietguard.app.AccessibilityChecks
          java -cp build/core-checks cn.quietguard.app.VersionChecks
          java -cp build/core-checks cn.quietguard.app.SplashChecks
          java -cp build/core-checks cn.quietguard.app.RuntimeChecks
          java -cp build/core-checks cn.quietguard.app.ButtonChecks
          java -cp build/core-checks cn.quietguard.app.TextTapChecks
          python3 tests/check_splash_safety.py
          java -cp build/core-checks cn.quietguard.app.UpdateChecks
          java -cp build/core-checks cn.quietguard.app.ControlChecks
          java -cp build/core-checks cn.quietguard.app.UpdateVpnChecks
      - name: 规则包转换与验签检查
        working-directory: quietguard
        run: |
          python3 -m unittest discover -s tools/rules -p 'test_*.py' -v
          mkdir -p build/rules-checks
          javac -encoding UTF-8 -d build/rules-checks app/src/main/java/cn/quietguard/app/rules/RuleBundleVerifier.java tools/rules/BundleChecks.java
          java -cp build/rules-checks cn.quietguard.app.rules.BundleChecks
      - name: 构建并静态检查
        working-directory: quietguard
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: 校验签名并准备 APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs quietguard/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/signature.txt"
          grep -qi '5384d768f44d11b628fda8b95056f6647cbb9ec8055f84aa6d54a8abef16f204' "$RUNNER_TEMP/signature.txt"
          cp quietguard/app/build/outputs/apk/debug/app-debug.apk "QuietGuard-${VERSION}.apk"
          sha256sum "QuietGuard-${VERSION}.apk" > "QuietGuard-${VERSION}.apk.sha256"
      - name: 确认版本码递增
        run: |
          git fetch origin master
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          current = int(re.search(r'versionCode (\d+)', pathlib.Path('quietguard/app/build.gradle').read_text()).group(1))
          previous = json.loads(subprocess.check_output(['git', 'show', 'origin/master:quietguard/update.json']))
          assert current > previous['versionCode'], 'Refusing to overwrite published assets without a higher versionCode'
          PY
      - name: 发布净屏版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "QuietGuard-${VERSION}.apk" "QuietGuard-${VERSION}.apk.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "净屏 v${VERSION}" --notes-file quietguard/RELEASE_NOTES.md --latest=false
          else
            gh release create "$GITHUB_REF_NAME" "QuietGuard-${VERSION}.apk" "QuietGuard-${VERSION}.apk.sha256" --verify-tag --title "净屏 v${VERSION}" --notes-file quietguard/RELEASE_NOTES.md --latest=false
          fi
      - name: 更新手机端版本信息
        run: |
          python3 - <<'PY'
          import os, json, re, pathlib, hashlib
          text = pathlib.Path('quietguard/app/build.gradle').read_text()
          code = int(re.search(r'versionCode (\d+)', text).group(1))
          version = os.environ['VERSION']
          data = {'applicationId': 'cn.quietguard.app', 'versionName': version, 'versionCode': code,
                  'apkUrl': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/quietguard-v{version}/QuietGuard-{version}.apk',
                  'sha256': hashlib.sha256(pathlib.Path(f'QuietGuard-{version}.apk').read_bytes()).hexdigest(),
                  'notes': pathlib.Path('quietguard/RELEASE_NOTES.md').read_text()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'quietguard-update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git fetch origin master
          git checkout -B quietguard-update-feed origin/master
          python3 - <<'PY'
          import os, json, pathlib, shutil
          candidate = pathlib.Path(os.environ['RUNNER_TEMP'], 'quietguard-update.json')
          target = pathlib.Path('quietguard/update.json')
          old = json.loads(target.read_text()) if target.exists() else {'versionCode': 0}
          new = json.loads(candidate.read_text())
          if new['versionCode'] <= old['versionCode']:
              raise SystemExit('versionCode must increase; refusing to downgrade update feed')
          shutil.copyfile(candidate, target)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quietguard/update.json
          git commit -m "chore(quietguard): publish update feed for ${VERSION}"
          git push origin HEAD:master
